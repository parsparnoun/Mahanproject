<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دانلود نقشه‌های معماری - پارس پرنون</title>
  <style>
    /* فراخوانی فونت B Nazanin مشابه صفحه اصلی */
    @font-face {
        font-family: 'B Nazanin';
        src: url('assets/BNazanin.ttf') format('truetype');
        font-weight: normal;
    }

    body {
        font-family: 'B Nazanin', Tahoma, Arial, sans-serif;
        background: #f0f2f5;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .box {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
        width: 320px;
    }

    .company-logo {
        width: 80px;
        height: auto;
        display: block;
        margin: 0 auto 15px auto;
    }

    .box h2 {
        margin-bottom: 20px;
        color: #1e293b;
    }

    .box input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 15px;
        outline: none;
    }

    .box input:focus { border-color: #000000; }

    .btn {
        width: 100%;
        padding: 12px;
        background: #245eea;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-family: inherit;
        font-size: 16px;
        transition: background-color 0.3s;
    }
    .btn:hover { background: #1d4ed8; }

    /* استایل دکمه دانلود */
    .download-btn {
        background: #13b98a; 
        margin-top: 10px;
    }
    .download-btn:hover { background: #0fa379; }

    /* مخفی کردن بخش دانلود در ابتدا */
    #download-section { display: none; }
  </style>
</head>
<body>

  <!-- فرم ورود صوری -->
  <div id="login-section" class="box">
    <img src="assets/logo.jpg" alt="آرم شرکت" class="company-logo">
    <h2>ورود جهت دریافت فایل</h2>
    <input type="text" id="username" placeholder="نام کاربری" />
    <input type="password" id="password" placeholder="رمز عبور" />
    <button class="btn" onclick="checkLogin()">ورود</button>
  </div>

  <!-- بخش دانلود (بعد از لاگین نمایش داده می‌شود) -->
  <div id="download-section" class="box">
    <img src="assets/logo.jpg" alt="آرم شرکت" class="company-logo">
    <h2 style="margin-bottom: 5px;">تایید هویت موفق</h2>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">برای دریافت نقشه‌های معماری مرحله دوم روی دکمه زیر کلیک کنید.</p>
    
    <!-- لینک دانلود مستقیم از گوگل درایو -->
    <a href="https://drive.google.com/uc?export=download&id=1asZisCWdqGsCo_yWdnuUvszkOqi_y_JE" style="text-decoration: none;">
        <button class="btn download-btn">📥 دانلود نقشه‌های معماری</button>
    </a>
  </div>

  <script>
    function checkLogin() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      // بررسی همان یوزر و پسورد
      if (user === "mahanproject" && pass === "parnoun135") {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('download-section').style.display = 'block';
      } else {
        alert("نام کاربری یا رمز عبور اشتباه است");
      }
    }
  </script>

</body>
</html>
